name: Portfolio CI

on:
  push:
  pull_request:

jobs:
  kaggriculture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kaggriculture-tournament-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m compileall -q src scripts tests
      - run: python -m pytest -q
      - run: python scripts/inspect_policy.py

  ev-prediction:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ev-purchase-prediction-ensemble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install numpy pandas scikit-learn pytest
      - run: python -m compileall -q src tests
      - run: python -m pytest -q

  caregiver-reproduction:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caregiver-interest-model-reproduction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install numpy pandas scikit-learn pytest
      - run: python -m compileall -q src tests
      - run: python -m pytest -q

  ai-study-assistant:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hkmu-ai-study-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py src scripts tests
      - run: python -m pytest -q
